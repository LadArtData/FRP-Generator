name: Build and push HARALD to OCIR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ADB wallet into build context
        env:
          WALLET_ZIP_B64: ${{ secrets.WALLET_ZIP_B64 }}
        run: |
          if [ -z "$WALLET_ZIP_B64" ]; then
            echo "WALLET_ZIP_B64 secret is missing"
            exit 1
          fi
          mkdir -p herald/wallet
          echo "$WALLET_ZIP_B64" | base64 -d > /tmp/wallet.zip
          unzip -o /tmp/wallet.zip -d herald/wallet
          test -f herald/wallet/tnsnames.ora
          test -f herald/wallet/cwallet.sso
          rm /tmp/wallet.zip
          echo "wallet files ready for image bake-in"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to OCIR
        run: |
          USER="${{ secrets.OCIR_USERNAME }}"
          case "$USER" in
            */*) ;;
            *) USER="bmi3vxyqnzrv/$USER" ;;
          esac
          echo "${{ secrets.OCIR_PASSWORD }}" | docker login bom.ocir.io \
            -u "$USER" --password-stdin

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: herald
          file: herald/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            bom.ocir.io/bmi3vxyqnzrv/harald/harald:latest
            bom.ocir.io/bmi3vxyqnzrv/harald/harald:${{ github.sha }}

      - name: Summary
        run: |
          echo "Pushed bom.ocir.io/bmi3vxyqnzrv/harald/harald:Latest"
          echo "Create a Container Instance with that image. No env vars."
