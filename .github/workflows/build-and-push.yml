name: Build and push HARALD to OCIR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to OCIR
        run: |
          # OCIR requires <namespace>/<username>. The secret may already include
          # the namespace (as on Scout) or be the bare username — normalize either.
          USER="${{ secrets.OCIR_USERNAME }}"
          case "$USER" in
            */*) ;;
            *) USER="bmi3vxyqnzrv/$USER" ;;
          esac
          echo "${{ secrets.OCIR_PASSWORD }}" | docker login bom.ocir.io \
            -u "$USER" --password-stdin

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: herald
          file: herald/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            bom.ocir.io/bmi3vxyqnzrv/harald/harald:latest
            bom.ocir.io/bmi3vxyqnzrv/harald/harald:${{ github.sha }}

      - name: Summary
        run: |
          echo "Pushed bom.ocir.io/bmi3vxyqnzrv/harald/harald:latest"
          echo "Restart or create the HARALD Container Instance to pull this image."
