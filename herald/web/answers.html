<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAROLD — Answer Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/harald.css">
</head>
<body>
<div id="nav"></div>
<div class="h-wrap" id="screen"></div>
<script src="/harald.js"></script>
<script>
(function () {
  "use strict";
  var H = window.Harald;
  var esc = H.escapeHtml;
  var MODULES = ["FIN", "HCM", "PAYROLL", "PROC", "BUDGET", "INV", "TECH", "GENERAL"];
  var LABEL = { FIN: "Financials", HCM: "Human Resources", PAYROLL: "Payroll",
    PROC: "Procurement", BUDGET: "Budget", INV: "Inventory", TECH: "Technical",
    GENERAL: "General" };
  var state = { items: [], stats: {}, filter: { status: null, module: null, q: "" }, timer: null };

  function on(sel, evt, fn) {
    document.querySelectorAll(sel).forEach(function (n) { n.addEventListener(evt, fn); });
  }

  async function boot() {
    document.getElementById("nav").innerHTML = H.nav("/answers");
    H.bindNav();
    if (!H.requireSession()) return;
    await load();
    render();
  }

  async function load() {
    try { state.stats = await H.api.get("/api/answers/stats"); } catch (e) { state.stats = {}; }
    var params = new URLSearchParams();
    if (state.filter.status) params.set("status", state.filter.status);
    if (state.filter.module) params.set("module", state.filter.module);
    if (state.filter.q) params.set("q", state.filter.q);
    try { state.items = await H.api.get("/api/answers?" + params.toString()); }
    catch (e) { state.items = []; H.toast(e.message, "error"); }
  }

  function render() {
    var s = state.stats;
    var cards = state.items.length ? state.items.map(function (a) {
      var overdue = a.review_due && a.review_due <= new Date().toISOString().slice(0, 10);
      return '<div class="h-listrow click" data-edit="' + a.ans_id + '" style="display:block">' +
        '<div style="font-weight:600;font-size:14px">' +
        esc(a.question_canonical || "(no question)") + "</div>" +
        '<div style="font-size:12.5px;color:var(--ink-3);line-height:1.5;margin-top:5px;' +
        'max-height:60px;overflow:hidden">' + esc(a.preview || "") + "</div>" +
        '<div class="h-row" style="margin-top:9px;flex-wrap:wrap;gap:8px">' +
        '<span class="h-pill ' + a.status + '">' + a.status + "</span>" +
        '<span class="h-tag">' + (LABEL[a.module_tag] || a.module_tag) + "</span>" +
        (a.tags ? '<span style="font-size:11px;color:var(--muted)">' + esc(a.tags) + "</span>" : "") +
        (a.owner_sme ? '<span style="font-size:11px;color:var(--muted)">&middot; ' +
          esc(a.owner_sme) + "</span>" : "") +
        (a.times_used ? '<span style="font-size:11px;color:var(--muted)">&middot; used ' +
          a.times_used + "x</span>" : "") +
        (overdue ? '<span class="h-pill error">review overdue</span>' : "") +
        "</div></div>";
    }).join("") : '<div class="h-empty"><span class="serif">No answers yet.</span>' +
      '<div class="h-sub" style="margin:0 auto">Add the standing answers iteria gives on every ' +
      "ERP bid. Approved answers are what the questionnaire filler and requirement drafting " +
      "reach for first.</div></div>";

    document.getElementById("screen").innerHTML =
      '<div class="h-row" style="justify-content:space-between;align-items:flex-start">' +
      '<div><div class="h-h1">Answer Library</div><div class="h-sub">Governed, approved, ' +
      "reusable answers. The single source of truth for the questions iteria answers on every " +
      'bid. Only approved answers are used to auto-answer anything.</div></div>' +
      '<button class="h-btn" id="new-answer">New answer</button></div>' +
      '<div class="h-metrics"><div class="h-metric"><div class="v">' + (s.total || 0) +
      '</div><div class="l">Answers</div></div>' +
      '<div class="h-metric good"><div class="v">' + (s.approved || 0) +
      '</div><div class="l">Approved</div></div>' +
      '<div class="h-metric"><div class="v">' + (s.draft || 0) +
      '</div><div class="l">Draft</div></div>' +
      '<div class="h-metric' + (s.review_overdue ? " warn" : "") + '"><div class="v">' +
      (s.review_overdue || 0) + '</div><div class="l">Review overdue</div></div></div>' +
      '<div class="h-filters"><span class="h-chip' + (!state.filter.status ? " on" : "") +
      '" data-status="">All status</span>' +
      ["approved", "draft", "deprecated"].map(function (st) {
        return '<span class="h-chip' + (state.filter.status === st ? " on" : "") +
          '" data-status="' + st + '">' + st + "</span>";
      }).join("") + "</div>" +
      '<div class="h-filters" style="margin-top:0"><span class="h-chip' +
      (!state.filter.module ? " on" : "") + '" data-module="">All modules</span>' +
      MODULES.map(function (m) {
        return '<span class="h-chip' + (state.filter.module === m ? " on" : "") +
          '" data-module="' + m + '">' + LABEL[m] + "</span>";
      }).join("") + "</div>" +
      '<div class="h-field" style="margin:10px 0 16px"><input class="h-input" id="search" ' +
      'placeholder="Search questions, answers, tags" value="' + esc(state.filter.q) + '"></div>' +
      cards;

    on("#new-answer", "click", function () { editor(null); });
    on("[data-status]", "click", function (e) {
      state.filter.status = e.currentTarget.getAttribute("data-status") || null;
      load().then(render);
    });
    on("[data-module]", "click", function (e) {
      state.filter.module = e.currentTarget.getAttribute("data-module") || null;
      load().then(render);
    });
    on("#search", "input", function (e) {
      state.filter.q = e.target.value;
      clearTimeout(state.timer);
      state.timer = setTimeout(function () { load().then(render); }, 220);
    });
    on("[data-edit]", "click", async function (e) {
      try { editor(await H.api.get("/api/answers/" + e.currentTarget.getAttribute("data-edit"))); }
      catch (err) { H.toast(err.message, "error"); }
    });
  }

  function editor(answer) {
    var a = answer || {};
    var canApprove = H.session.is("reviewer");
    H.modal(
      '<div class="h-modal-head">' + (a.ans_id ? "Edit answer" : "New answer") + "</div>" +
      '<div class="h-modal-body">' +
      '<div class="h-field"><label>Canonical question</label><input class="h-input" id="a-q" ' +
      'value="' + esc(a.question_canonical || "") + '" placeholder="The question as agencies ask it"></div>' +
      '<div class="h-field"><label>Approved answer</label><textarea class="h-input" id="a-a" ' +
      'style="min-height:130px">' + esc(a.answer_text || "") + "</textarea></div>" +
      '<div class="h-row" style="gap:12px"><div class="h-field" style="flex:1"><label>Module</label>' +
      '<select class="h-input" id="a-m">' + MODULES.map(function (m) {
        return '<option value="' + m + '"' + (a.module_tag === m ? " selected" : "") + ">" +
          LABEL[m] + "</option>";
      }).join("") + "</select></div>" +
      '<div class="h-field" style="flex:1"><label>Status</label><select class="h-input" id="a-s"' +
      (canApprove ? "" : " disabled") + ">" +
      ["draft", "approved", "deprecated"].map(function (st) {
        return '<option value="' + st + '"' + (a.status === st ? " selected" : "") + ">" + st +
          "</option>";
      }).join("") + "</select></div></div>" +
      '<div class="h-row" style="gap:12px"><div class="h-field" style="flex:1">' +
      '<label>Owner (SME)</label><input class="h-input" id="a-o" value="' +
      esc(a.owner_sme || "") + '"></div>' +
      '<div class="h-field" style="flex:1"><label>Tags</label><input class="h-input" id="a-t" ' +
      'value="' + esc(a.tags || "") + '" placeholder="comma,separated"></div></div>' +
      '<div class="h-row" style="gap:12px"><div class="h-field" style="flex:1">' +
      '<label>Effective date</label><input class="h-input" id="a-eff" value="' +
      esc(a.effective_date || "") + '" placeholder="2026-01-01"></div>' +
      '<div class="h-field" style="flex:1"><label>Review due</label><input class="h-input" ' +
      'id="a-rev" value="' + esc(a.review_due || "") + '" placeholder="2026-07-01"></div></div>' +
      (canApprove ? "" : '<div class="h-hint">Approving an answer needs the reviewer role.</div>') +
      "</div>" +
      '<div class="h-modal-foot split"><div>' +
      (a.ans_id && canApprove
        ? '<button class="h-btn ghost sm" id="a-reviewed">Mark reviewed (+6mo)</button>' : "") +
      '</div><div class="h-row"><button class="h-btn ghost" id="a-cancel">Cancel</button>' +
      '<button class="h-btn" id="a-save">Save</button></div></div>',
      function (root) {
        root.querySelector("#a-cancel").addEventListener("click", H.closeModal);
        var reviewed = root.querySelector("#a-reviewed");
        if (reviewed) {
          reviewed.addEventListener("click", async function () {
            try {
              await H.api.post("/api/answers/" + a.ans_id + "/reviewed", { months: 6 });
              H.closeModal();
              await load();
              render();
              H.toast("Marked reviewed. Next review in six months.");
            } catch (error) { H.toast(error.message, "error"); }
          });
        }
        root.querySelector("#a-save").addEventListener("click", async function () {
          var button = root.querySelector("#a-save");
          button.disabled = true;
          button.innerHTML = '<span class="h-spin"></span>';
          var payload = {
            question_canonical: root.querySelector("#a-q").value.trim(),
            answer_text: root.querySelector("#a-a").value.trim(),
            module_tag: root.querySelector("#a-m").value,
            status: root.querySelector("#a-s").value,
            owner_sme: root.querySelector("#a-o").value.trim(),
            tags: root.querySelector("#a-t").value.trim(),
            effective_date: root.querySelector("#a-eff").value.trim(),
            review_due: root.querySelector("#a-rev").value.trim()
          };
          try {
            if (a.ans_id) await H.api.patch("/api/answers/" + a.ans_id, payload);
            else await H.api.post("/api/answers", payload);
            H.closeModal();
            await load();
            render();
            H.toast("Saved.");
          } catch (error) {
            H.toast(error.message, "error");
            button.disabled = false;
            button.textContent = "Save";
          }
        });
      }
    );
  }

  boot();
})();
</script>
</body>
</html>
